name: Refresh bird observations
on:
  schedule:
    - cron: "0 0 1 * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-observations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install rembg==2.0.60 'onnxruntime>=1.19,<2'
      - run: npm run prepare:observations
        env:
          CUTOUT_PYTHON: python
          OBSERVATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
      - run: npm run build
      - name: Save the completed snapshot
        id: snapshot
        run: |
          git add data/observed-birds.json public/bird-cutouts/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh monthly bird observations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request Vercel deployment
        if: steps.snapshot.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          : "${VERCEL_DEPLOY_HOOK:?Add VERCEL_DEPLOY_HOOK to repository Actions secrets}"
          curl --fail --silent --show-error --max-time 30 \
            --request POST --output /dev/null "$VERCEL_DEPLOY_HOOK"
